<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');
    :root{
      --paper:#17181C; --raised:#1F2026;
      --ink:#ECEAE4; --soft:#B9B8B0; --faint:#8E8F98;
      --line:#32333A; --line2:#787982;
      --live:#7FB489;
      --sans:'Schibsted Grotesk','Segoe UI',system-ui,sans-serif;
      --mono:'Roboto Mono',ui-monospace,Consolas,monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
         font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
    h1,h2,p,dl,dt,dd,ol,ul,li{margin:0;padding:0}
    li{list-style:none}
    a{color:var(--ink);text-decoration:none}
    p{text-wrap:pretty}
    .mono{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.04em}
    .lbl{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;
         text-transform:uppercase;color:var(--faint)}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--live);flex:none}
    .btn{display:inline-flex;align-items:center;justify-content:center;height:44px;
         padding:0 22px;font-size:14px;font-weight:500;border-radius:4px}
    .btn-solid{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
    .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
    .nav{position:relative;display:flex;align-items:center;min-height:34px;
         font-size:15px;color:var(--soft);padding-left:16px}
    .nav-on{color:var(--ink);font-weight:500}
    .nav-on::before{content:"";position:absolute;left:0;top:50%;margin-top:-2px;
                    width:4px;height:4px;background:var(--ink)}
  </style>
</helmet>

<div style="position:relative;width:360px;height:640px;background:var(--paper);overflow:hidden">

  <!-- .bm-menu plein cadre, opaque : pas de voile, pas de panneau partiel -->
  <nav style="position:absolute;inset:0;background:var(--paper);padding:0 24px;display:flex;flex-direction:column">

    <div style="height:56px;display:flex;align-items:center;justify-content:space-between;margin:0 -12px 0 -16px;padding:0 12px 0 8px;border-bottom:1px solid var(--line)">
      <button aria-label="Fermer le menu" style="width:44px;height:44px;background:none;border:0;padding:0;position:relative;cursor:pointer">
        <span style="position:absolute;left:12px;top:21px;width:20px;height:1.5px;background:var(--ink);transform:rotate(45deg)"></span>
        <span style="position:absolute;left:12px;top:21px;width:20px;height:1.5px;background:var(--ink);transform:rotate(-45deg)"></span>
      </button>
      <span class="mono" style="color:var(--faint);padding-right:6px">Menu</span>
    </div>

    <!-- cibles 52px, alignées à gauche, pas d icônes : le mot suffit -->
    <div style="display:flex;flex-direction:column;margin-top:24px">
      <a href="#" style="display:flex;align-items:center;min-height:52px;font-size:22px;font-weight:500;letter-spacing:-.02em;color:var(--soft)">Accueil</a>
      <a href="#" style="display:flex;align-items:center;min-height:52px;font-size:22px;font-weight:500;letter-spacing:-.02em;color:var(--soft)">À propos</a>
      <a href="#" style="display:flex;align-items:center;min-height:52px;font-size:22px;font-weight:500;letter-spacing:-.02em;color:var(--ink)">Projets<span style="margin-left:12px;width:5px;height:5px;background:var(--ink);border-radius:50%"></span></a>
      <a href="#" style="display:flex;align-items:center;min-height:52px;font-size:22px;font-weight:500;letter-spacing:-.02em;color:var(--soft)">Contact</a>
    </div>

    <div style="margin-top:auto;padding:22px 0 30px;border-top:1px solid var(--line)">
      <div class="lbl" style="margin-bottom:14px">Langue</div>
      <div style="display:flex;gap:10px">
        <span class="mono" style="display:flex;align-items:center;height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:4px;font-weight:500">FR</span>
        <span class="mono" style="display:flex;align-items:center;height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:4px;color:var(--soft)">EN</span>
        <span class="mono" style="display:flex;align-items:center;height:40px;padding:0 16px;border:1px solid var(--line2);border-radius:4px;color:var(--soft)">日本語</span>
      </div>
    </div>

  </nav>

</div>
</x-dc>
</body>
</html>
